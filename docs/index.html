<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Hub</title>
<meta name="theme-color" content="#101214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f6f6f4;
  --card: #ffffff;
  --text: #17191c;
  --muted: #6a6f76;
  --line: #e3e3df;
  --good: #1f7a4d;
  --good-bg: #e4f2ea;
  --warn: #8a5a00;
  --warn-bg: #fbefd2;
  --bad: #a3322a;
  --bad-bg: #f8e3e0;
  --accent: #2b5fd9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101214;
    --card: #181b1f;
    --text: #e8e9ea;
    --muted: #9096a0;
    --line: #262a30;
    --good: #5fcf94;
    --good-bg: #16301f;
    --warn: #e5b84d;
    --warn-bg: #33290f;
    --bad: #f08a80;
    --bad-bg: #36191a;
    --accent: #7ba2ff;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
}
main { max-width: 640px; margin: 0 auto; }
header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 0 8px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
button {
  font: inherit; color: var(--accent); background: none; border: 0; padding: 8px 0 8px 12px; cursor: pointer;
}
#meta { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
#meta.stale { color: var(--warn); }
section { margin: 20px 0 28px; }
.agent-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.error {
  margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); font-size: 14px;
}
.card {
  display: block; margin-top: 10px; padding: 14px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; color: inherit; text-decoration: none;
}
a.card:active { opacity: 0.7; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.right { text-align: right; flex: none; }
.value { font-weight: 650; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge {
  display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px;
  background: var(--line); color: var(--muted);
}
.badge.good { background: var(--good-bg); color: var(--good); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
svg.spark { display: block; width: 100%; height: 36px; margin-top: 10px; }
svg.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Agent Hub</h1>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <p id="meta">Loading</p>
  <div id="root"></div>
</main>
<script src="app.js"></script>
</body>
</html>
